name: Auto Generate and Publish Article

on:
  schedule:
    - cron: "20 1 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: 本次生成几篇（最多 3 篇）
        required: false
        default: "1"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: auto-publish-article
  cancel-in-progress: false

jobs:
  generate-build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate and validate article
        run: npm run article:generate -- --count "${{ inputs.count || '1' }}"
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
      - name: Build static website
        run: npm run build:github-pages
        env:
          GITHUB_PAGES_BASE: /
          SITE_URL: https://apple-id-guide.github.io
      - name: Commit generated article
        run: |
          git config user.name "apple-id-guide article bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/generated-articles.json content/topic-pool.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish daily search article"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-github
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
